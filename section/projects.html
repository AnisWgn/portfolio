        <!-- Projects Section -->
        <section id="projects" class="page-section">
        <div class="container mx-auto px-6 w-full">
            <h3 class="text-3xl font-bold mb-12 text-center">
                <span>Ce Que J'ai Construit</span>
                <span class="text-green-400 text-lg block mt-2">// Certains fonctionnent vraiment</span>
            </h3>

            <div x-data="projectsComponent()" x-init="loadProjects()">
                <template x-if="projects.length > 0">
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <template x-for="project in projects" :key="project.name">
                            <div class="project-card bg-gray-900/50 border border-gray-800 rounded-lg p-6 hover:border-green-400/50 transition-all">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="text-green-400 text-3xl" x-text="project.icon || '📁'"></div>
                                    <div class="flex gap-2">
                                        <template x-if="project.status">
                                            <span class="text-xs px-2 py-1 rounded" :class="getStatusClass(project.status)" x-text="project.status"></span>
                                        </template>
                                    </div>
                                </div>
                                <h4 class="text-xl font-semibold mb-2" x-text="project.name"></h4>
                                <p class="text-gray-400 text-sm mb-4" x-text="project.description"></p>
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <template x-for="tag in [...(project.langages || []), ...(project.technologies || [])].filter(t => t)" :key="tag">
                                        <span class="text-xs px-2 py-1 bg-gray-800 rounded" x-text="tag"></span>
                                    </template>
                                </div>
                                <div class="flex flex-wrap gap-3">
                                    <template x-if="project.url">
                                        <a :href="project.url" target="_self" class="text-sm text-green-400 hover:text-green-300 transition-colors">
                                            Voir le projet →
                                        </a>
                                    </template>
                                    <template x-if="project.compte_rendu">
                                        <a :href="project.compte_rendu" target="_self" class="text-sm text-green-400 hover:text-green-300 transition-colors">
                                            Voir le compte rendu →
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </section>
