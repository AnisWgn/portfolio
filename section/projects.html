        <!-- Projects Section -->
        <section id="projects" class="page-section">
        <div class="container mx-auto px-6 w-full">
            <h3 class="text-3xl font-bold mb-14 text-center text-stone-900">
                <span>Ce Que J'ai Construit</span>
                <span class="text-stone-500 text-xl font-normal block mt-3">Sélection de projets</span>
            </h3>

            <div x-data="projectsComponent()" x-init="loadProjects()">
                <template x-if="projects.length > 0">
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <template x-for="project in projects" :key="project.name">
                            <div class="project-card bg-white border border-stone-200 rounded-xl p-8 md:p-10 hover:border-teal-300 transition-all shadow-sm">
                                <h4 class="text-2xl md:text-3xl font-semibold mb-3 text-stone-900" x-text="project.name"></h4>

                                    <template x-for="tag in [...(project.langages || []), ...(project.technologies || [])].filter(t => t)" :key="tag">

                                    </template>
                                </div>
                                <div class="flex flex-wrap gap-3">
                                    <template x-if="project.url">
                                        <a :href="project.url" target="_self" class="text-lg text-teal-700 hover:text-teal-800 font-semibold transition-colors">
                                            Voir le projet →
                                        </a>
                                    </template>
                                    <template x-if="project.compte_rendu">
                                        <a :href="project.compte_rendu" target="_self" class="text-lg text-teal-700 hover:text-teal-800 font-semibold transition-colors">
                                            Voir le compte rendu →
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
